[package]
name = "gpuhash"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Apple Silicon GPU batch hashing for xxHash32, xxHash64, XXH3, and SHA-256"

[lib]
name = "gpuhash"
path = "src/lib.rs"

[dependencies]
digest = "0.11.3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2.7"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
sha2 = "0.11.0"
twox-hash = "2.1.2"

[[bench]]
name = "hash_batch"
harness = false
